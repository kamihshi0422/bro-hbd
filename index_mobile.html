<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#d9fbf5">
<title>パブロ🥦🍼 Birthday Message Board</title>
<style>
:root{
  --mint:#25c8b8;--deep:#26344d;--ink:#27384b;--paper:#ffffff;
  --line:rgba(40,91,105,.22);--shadow:0 18px 55px rgba(28,91,100,.15);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:system-ui,-apple-system,"Noto Sans JP","Yu Gothic",sans-serif;color:var(--ink);overflow:hidden}
body{
  background:
    radial-gradient(circle at 12% 18%,rgba(255,255,255,.9) 0 2px,transparent 3px),
    radial-gradient(circle at 82% 72%,rgba(255,255,255,.75) 0 3px,transparent 4px),
    linear-gradient(135deg,#c9f5ed,#eafcff 48%,#d8f0ff);
  background-size:38px 38px,54px 54px,auto;
  overflow-x:hidden;
}
.page{height:100vh;height:100dvh;min-height:0;padding:clamp(10px,2.2vh,24px) clamp(14px,3vw,38px);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.topline{width:min(1180px,100%);display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}
.eyebrow{font-size:clamp(11px,1.3vw,14px);font-weight:900;letter-spacing:.18em;color:#168f8c}
.brand{font-size:clamp(13px,1.5vw,17px);font-weight:900;color:#168f8c}
.board{width:min(1180px,100%);position:relative;flex:1;min-height:0;display:flex;flex-direction:column;background:rgba(255,255,255,.74);border:1px solid rgba(255,255,255,.9);border-radius:26px;box-shadow:var(--shadow);overflow:hidden;backdrop-filter:blur(12px)}
.board:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 0 44%,rgba(255,255,255,.45) 44.2% 45%,transparent 45.2%);z-index:0}
.header{position:relative;z-index:1;flex:0 0 auto;padding:clamp(14px,2.4vh,26px) clamp(20px,4vw,48px) 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
h1{margin:0;color:var(--deep);font-size:clamp(28px,5vw,58px);line-height:1;font-weight:1000;letter-spacing:.02em}
h1 span{color:var(--mint)}
.subtitle{margin:9px 0 0;color:#269b9b;font-weight:800;letter-spacing:.22em;font-size:clamp(10px,1.3vw,14px)}
.counter{font-size:13px;font-weight:900;color:#168f8c;white-space:nowrap}
.profile{position:relative;z-index:1;flex:1;min-height:0;display:grid;grid-template-columns:minmax(260px, .95fr) minmax(300px,1.05fr);gap:clamp(18px,3vw,38px);padding:clamp(10px,1.8vh,20px) clamp(20px,4vw,48px) 16px;overflow:hidden}
.visual{position:relative;min-height:0;height:100%;border-radius:18px;overflow:hidden;background:linear-gradient(145deg,#9de6dc,#d5f9f2 55%,#a9dff3);display:flex;align-items:center;justify-content:center}
.visual:before,.visual:after{content:"";position:absolute;border:1px solid rgba(255,255,255,.55);border-radius:50%;width:310px;height:310px}
.visual:after{width:390px;height:390px}
.avatar{position:relative;z-index:1;width:100%;height:100%;max-height:520px;object-fit:contain}
.avatar-fallback{position:relative;z-index:1;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:#287f82;font-weight:800}
.avatar-fallback .emoji{font-size:clamp(76px,13vw,150px)}
.visual.has-error .avatar{display:none}
.visual.has-error .avatar-fallback{display:flex}
.image-label{position:absolute;z-index:2;left:15px;bottom:13px;padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.76);font-size:11px;font-weight:900;letter-spacing:.1em;color:#278f91}
.details{align-self:stretch;min-width:0;min-height:0;height:100%;padding:clamp(4px,1vw,12px) 0;display:flex;flex-direction:column;overflow:hidden}
.kicker{display:inline-block;background:var(--mint);color:white;padding:7px 14px;font-weight:900;letter-spacing:.08em;transform:skew(-8deg);margin-bottom:15px}
.name{font-size:clamp(30px,4.5vw,54px);font-weight:1000;line-height:1.12;color:var(--deep);overflow-wrap:anywhere;margin:0 0 17px}
.name:after{content:"";display:block;width:100%;height:5px;margin-top:15px;background:linear-gradient(90deg,var(--mint),rgba(37,200,184,.08));border-radius:10px}
.message-label{font-size:12px;font-weight:1000;letter-spacing:.2em;color:#159c9a;margin:0 0 10px}
.message{white-space:pre-wrap;overflow-wrap:anywhere;font-size:clamp(15px,1.65vw,19px);line-height:1.9;font-weight:650;color:#34465b;margin:0;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 9px 8px 0;scrollbar-width:thin;scrollbar-color:#8bcfc8 transparent}
.from{flex:0 0 auto;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;font-weight:900;letter-spacing:.12em;color:#479b9b}
.controls{position:relative;z-index:2;flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:18px;padding:0 20px 12px}
.nav{border:0;width:44px;height:44px;border-radius:50%;background:#20bfae;color:white;font-size:24px;line-height:1;cursor:pointer;box-shadow:0 5px 14px rgba(21,160,150,.22);transition:transform .18s,opacity .18s}
.nav:hover{transform:scale(1.07)}.nav:disabled{opacity:.3;cursor:default;transform:none}
.dots{display:flex;gap:7px;align-items:center;max-width:min(55vw,420px);overflow:auto;padding:5px}
.dot{border:0;flex:0 0 8px;width:8px;height:8px;border-radius:50%;background:#a8d8d4;padding:0;cursor:pointer}
.dot.active{background:#159f99;outline:4px solid rgba(21,159,153,.14)}
.swipe-hint{flex:0 0 auto;font-size:11px;color:#438f91;font-weight:900;letter-spacing:.14em;text-align:center;padding:0 12px 12px}
.footer{margin-top:14px;color:#3d9293;font-size:11px;font-weight:800;letter-spacing:.12em;text-align:center}
@media(max-width:700px){
 .page{padding:10px 10px 12px;justify-content:flex-start}
 .topline{flex:0 0 auto;margin:2px 2px 10px}
 .board{border-radius:20px}
 .header{align-items:center;padding:clamp(12px,2vh,18px) 18px 8px}
 .profile{flex:1;min-height:0;grid-template-columns:1fr;grid-template-rows:minmax(110px,42%) minmax(0,1fr);gap:12px;padding:10px 18px 12px;overflow:hidden}
 .visual{min-height:0;height:100%}
 .avatar{max-height:390px}
 .details{height:100%;min-height:0;padding:0 2px}
 .kicker{margin-bottom:10px}
 .name{font-size:clamp(29px,8vw,42px);margin-bottom:12px}
 .message{font-size:15px;line-height:1.8}
 .from{margin-top:15px}
 .controls{padding-bottom:10px}
 .swipe-hint{padding-bottom:10px}
}
@media(prefers-reduced-motion:no-preference){.profile{animation:fadein .28s ease}@keyframes fadein{from{opacity:.55;transform:translateX(12px)}to{opacity:1;transform:none}}}

/* スマートフォン向けレイアウト調整 */
@media (max-width: 600px) {
  .page {
    padding: 8px 8px 10px;
  }

  .topline {
    gap: 8px;
    margin: 0 2px 8px;
  }

  .eyebrow {
    font-size: 9px;
    letter-spacing: .08em;
  }

  .brand {
    font-size: 12px;
    white-space: nowrap;
  }

  .board {
    border-radius: 16px;
  }

  .header {
    padding: 13px 14px 5px;
    gap: 6px;
    align-items: flex-start;
  }

  h1 {
    font-size: clamp(23px, 7vw, 34px);
    line-height: 1.05;
  }

  .subtitle {
    margin-top: 6px;
    font-size: 8px;
    letter-spacing: .12em;
  }

  .counter {
    padding-top: 4px;
    font-size: 11px;
  }

  .profile {
    grid-template-rows: minmax(105px, 30%) minmax(0, 1fr);
    gap: 8px;
    padding: 8px 13px 8px;
  }

  .visual {
    border-radius: 13px;
    background: linear-gradient(145deg, #f4fbfa, #eaf7fb);
  }

  .visual:before,
  .visual:after {
    width: 180px;
    height: 180px;
  }

  .visual:after {
    width: 230px;
    height: 230px;
  }

  .avatar {
    max-height: 100%;
    padding: 3px;
    object-fit: contain;
  }

  .image-label {
    left: 8px;
    bottom: 7px;
    padding: 4px 7px;
    font-size: 8px;
  }

  .details {
    padding: 0 1px;
  }

  .kicker {
    align-self: flex-start;
    margin-bottom: 7px;
    padding: 5px 10px;
    font-size: 10px;
  }

  .name {
    font-size: clamp(25px, 7.5vw, 36px);
    line-height: 1.12;
    margin-bottom: 8px;
  }

  .name:after {
    height: 3px;
    margin-top: 8px;
  }

  .message-label {
    margin-bottom: 6px;
    font-size: 10px;
  }

  .message {
    font-size: 14px;
    line-height: 1.75;
    padding-right: 5px;
  }

  .from {
    margin-top: 8px;
    padding-top: 7px;
    font-size: 10px;
  }

  .controls {
    gap: 12px;
    padding: 0 12px 7px;
  }

  .nav {
    width: 42px;
    height: 42px;
    flex: 0 0 42px;
    font-size: 23px;
  }

  .dots {
    max-width: calc(100vw - 140px);
    gap: 8px;
  }

  .dot {
    flex-basis: 9px;
    width: 9px;
    height: 9px;
  }

  .swipe-hint {
    padding: 0 8px 8px;
    font-size: 9px;
    letter-spacing: .1em;
  }

  .footer {
    margin-top: 7px;
    font-size: 9px;
    letter-spacing: .06em;
  }
}

/* スマートフォンの横向きなど、縦の表示領域が小さい場合 */
@media (max-width: 700px) and (max-height: 560px) {
  .header {
    padding-top: 8px;
  }

  .profile {
    grid-template-rows: minmax(75px, 25%) minmax(0, 1fr);
    gap: 6px;
    padding-top: 5px;
  }

  .kicker {
    margin-bottom: 4px;
  }

  .name {
    font-size: 24px;
    margin-bottom: 4px;
  }

  .name:after {
    margin-top: 5px;
  }

  .message {
    font-size: 12px;
    line-height: 1.5;
  }

  .controls {
    padding-bottom: 4px;
  }

  .swipe-hint {
    padding-bottom: 4px;
  }
}

</style>
</head>
<body>
<main class="page">
  <div class="topline">
    <div class="eyebrow">SPECIAL BIRTHDAY MESSAGE</div>
    <div class="brand">🥦 PABLO 🍼</div>
  </div>
  <section class="board" aria-label="誕生日寄せ書き">
    <header class="header">
      <div><h1><span>HAPPY</span> BIRTHDAY!</h1><p class="subtitle">MESSAGE COLLECTION FOR PABLO</p></div>
      <div class="counter" id="counter">01 / 09</div>
    </header>
    <article class="profile" id="profile" aria-live="polite">
      <div class="visual" id="visual">
        <img class="avatar" id="avatar" alt="投稿者のアバター画像">
        <div class="avatar-fallback"><div class="emoji">🥦</div><div>AVATAR</div></div>
        <div class="image-label">SPECIAL THANKS</div>
      </div>
      <div class="details">
        <div class="kicker">MESSAGE FOR PABLO</div>
        <h2 class="name" id="name">読み込み中</h2>
        <p class="message-label">BIRTHDAY MESSAGE</p>
        <p class="message" id="message"></p>
        <div class="from" id="from">FROM MESSAGE BOARD</div>
      </div>
    </article>
    <nav class="controls" aria-label="メッセージ切り替え">
      <button class="nav" id="prev" aria-label="前のメッセージ">‹</button>
      <div class="dots" id="dots"></div>
      <button class="nav" id="next" aria-label="次のメッセージ">›</button>
    </nav>
    <div class="swipe-hint">← SWIPE / DRAG TO CHANGE →</div>
  </section>
  <div class="footer">HAPPY BIRTHDAY PABLO 🥦🍼 · WITH LOVE</div>
</main>
<script>
const messages = [{"name": "弱い犬", "message": "生きろ。そなたは美しい。", "image": "https://drive.google.com/thumbnail?id=1hcyjvVC_fZqSEVB95dqpUmbFtNf9xhEk&sz=w1200", "timestamp": "2026-11-07 06:29:36.387000"}, {"name": "正義", "message": "誕生日おめでとうございます🎉!(´▽｀)🎉\n良い一年になりますように(ㅅ´ ˘ `)\nいっぱいブロッコリー食べてもっと大きくなってください！", "image": "https://drive.google.com/thumbnail?id=1osjhUffhQ8a61FSBfhREs4Ipzys0ldja&sz=w1200", "timestamp": "2026-11-07 07:29:19.776000"}, {"name": "しるみぃ", "message": "ブロさん誕生日おめでとござます！めっちゃ尊敬してます！これからもいろんな人に🥦配ってください！そして仲良くしてください！おめでとうございます！", "image": "https://drive.google.com/thumbnail?id=1_cBdL2QoLCmZLincfkxcPJlWgjiuLweq&sz=w1200", "timestamp": "2026-11-07 09:40:55.371000"}, {"name": "結愛 みぃ🍵🕊️", "message": "お誕生日おめでとう🎉\n生まれてきてくれて\n出会ってくれてありがとう🫶\n来年もお祝いさせてね！愛してるよっ😘", "image": "https://drive.google.com/thumbnail?id=1nXzlfCMLN5vIdyawIPC0DTWkzrzjL-yI&sz=w1200", "timestamp": "2026-11-07 13:10:47.225000"}, {"name": "どーなってんだ！", "message": "ハッピーバースデー‼️パブロ記者にはこれからも沢山の記事で沢山の人を幸せにして欲しいと思います👏🏻✨👏🏻✨👏🏻✨", "image": "https://drive.google.com/thumbnail?id=1pyjLRsO-ukYlQkfzMEis1jPwoiST_ubv&sz=w1200", "timestamp": "2026-11-08 01:26:18.479000"}, {"name": "u", "message": "ブロさん誕生日おめでとう🎉いつも頼りにさせてもらってます！これからも楽しいこといっぱい目論んで行こうね💪いい1年になること祈ってるよぉ⤴︎︎︎", "image": "https://drive.google.com/thumbnail?id=1m5mPnbpFEMwaZ0lILiG4NzeGmp3KszGz&sz=w1200", "timestamp": "2026-11-08 05:26:11.818000"}, {"name": "柚乃ちゃん", "message": "ブロさん！お誕生日おめでと🎉\n今回は生誕(収穫)祭ということで🥦になってみたよ\nいつも楽しい時間をありがとうね！ブロさんにもたくさん元気貰ってるっ！\nこれからもよろしくね！ウホホン(  ◜ω◝🫶", "image": "https://drive.google.com/thumbnail?id=1sU45SpZT6DLIwVbXlYO7N5tbyg6g27Yx&sz=w1200", "timestamp": "2026-11-08 14:08:34.074000"}, {"name": "ふるれむ", "message": "誕生日おめでとー！\n良い一日を過ごしてね！\nパブロさんが良い一年になる事、ｲﾉｯﾃﾙﾖ!", "image": "https://drive.google.com/thumbnail?id=1OV1WNat57uJG22onr37gGnjLH6vpnLEA&sz=w1200", "timestamp": "2026-11-08 14:13:11.575000"}, {"name": "アヘ顔ダブルピース", "message": "ブロさん、誕生日おめでとう！！🎉🎂\n\nブロさんとの出会いって僕にとってすごい印象に残ってます✨️\n\nあのときブロさんがいてくれたから、今の大切な繋がりや時間があるんだと思う。\n\nブロさんの何気ない一言がこんなにも幸せいっぱいになったよありがとう🫶\n\nいつもふざけたり笑ったりしてるけど、こういう縁を作ってくれたブロさんには感謝してます！\n\nこれからも変わらず仲良くしていこう！\n\nブロさんにとって幸せな一年になりますように！！祈ってくれ！！！\n誕生日おめでとう！！", "image": "https://drive.google.com/thumbnail?id=1kTfJA0SQcdQ9Q91gzuFW6A2ZJdRIblzl&sz=w1200", "timestamp": "2026-11-08 17:25:23.398000"}];
messages.sort((first, second) => first.name.localeCompare(second.name, "ja"));\nlet current = 0;
const $ = id => document.getElementById(id);
function render(){
  const item = messages[current];
  $("name").textContent = item.name;
  $("message").textContent = item.message;
  $("from").textContent = "FROM " + item.name;
  $("counter").textContent = String(current+1).padStart(2,"0")+" / "+String(messages.length).padStart(2,"0");
  const visual = $("visual"), avatar = $("avatar");
  visual.classList.remove("has-error");
  avatar.onload = () => visual.classList.remove("has-error");
  avatar.onerror = () => visual.classList.add("has-error");
  avatar.src = item.image || "";
  $("prev").disabled = false;
  $("next").disabled = false;
  $("dots").replaceChildren(...messages.map((_,i)=>{
    const b=document.createElement("button"); b.className="dot"+(i===current?" active":"");
    b.setAttribute("aria-label",`${i+1}番目のメッセージ`); b.addEventListener("click",()=>go(i)); return b;
  }));
}
function go(i){current=(i+messages.length)%messages.length;render();}
$("prev").addEventListener("click",()=>go(current-1));
$("next").addEventListener("click",()=>go(current+1));
let startX=0,startY=0;
$("profile").addEventListener("touchstart",e=>{startX=e.changedTouches[0].clientX;startY=e.changedTouches[0].clientY;},{passive:true});
$("profile").addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy))go(current+(dx<0?1:-1));},{passive:true});
let pointerStart=null;
$("profile").addEventListener("pointerdown",e=>{if(e.pointerType==="mouse")pointerStart=e.clientX;});
$("profile").addEventListener("pointerup",e=>{if(pointerStart!==null){const dx=e.clientX-pointerStart;if(Math.abs(dx)>65)go(current+(dx<0?1:-1));pointerStart=null;}});
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")go(current+1);if(e.key==="ArrowLeft")go(current-1);});
render();
</script>
</body>
</html>
